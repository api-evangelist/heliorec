aid: heliorec
name: HelioRec
description: HelioRec is a floating photovoltaic (FPV) engineering and manufacturing
  company that designs and builds floating solar power plants for lakes, reservoirs,
  and nearshore waters. It uses an engineering-led, load-based methodology focused
  on structural behavior, mooring integrity, installation practicality, and long-term
  operability on water, delivering grid-connected, utility-scale systems engineered
  for real water conditions. HelioRec serves independent power producers and utilities,
  hydropower and reservoir owners, industrial and infrastructure operators, and water
  and agriculture stakeholders, supporting projects from site-specific concept through
  execution. The company is backed by Techstars.
